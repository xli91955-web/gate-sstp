name: Check SSTP and publish Pages
'on':
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sstp-pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python vpngate.py
        env:
          CHECK_WORKER: ${{ vars.CHECK_WORKER }}
          EDGE_HOSTS: ${{ vars.EDGE_HOSTS }}
          CHECK_TOKEN: ${{ secrets.CHECK_TOKEN }}
          NODES_URL: https://${{ github.repository_owner }}.github.io/gate-sstp/nodes.txt
          CHECK_CONCURRENCY: '8'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
